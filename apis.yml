aid: yugabytedb
name: YugabyteDB
description: >-
  YugabyteDB is a distributed PostgreSQL-compatible SQL database for cloud-native and mission-critical applications. It
  is delivered as open-source YugabyteDB Core, the fully managed YugabyteDB Aeon DBaaS, and the self-managed YugabyteDB
  Anywhere control plane, with REST APIs for programmatic management of accounts, projects, clusters, universes,
  backups, restores, read replicas, allow lists, and maintenance windows.
type: Index
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
