openapi: 3.1.0
info:
  title: YugabyteDB Aeon REST Access Keys Runtime configuration API
  description: The YugabyteDB Aeon REST API provides programmatic access to YugabyteDB's fully managed cloud database service. Developers and operators can use it to deploy and manage database clusters, configure read replicas, schedule and execute on-demand backups and restores, manage IP allow lists, and set up monitoring and alerts. Authentication is performed using API keys passed as bearer tokens in the Authorization header. All paths are scoped to an account and project, which can be obtained from the YugabyteDB Aeon UI profile page.
  version: v1
  contact:
    name: Yugabyte Support
    url: https://support.yugabyte.com
  termsOfService: https://www.yugabyte.com/yugabytedb-managed-service-terms/
  x-generated-from: documentation
  x-source-url: https://api-docs.yugabyte.com/docs/managed-apis/
  x-last-validated: '2026-05-03'
servers:
- url: https://cloud.yugabyte.com/api/public/v1
  description: YugabyteDB Aeon Production Server
security:
- bearerAuth: []
tags:
- name: Runtime configuration
paths:
  /api/v1/customers/{cUUID}/runtime_config/scopes:
    get:
      description: Lists all (including empty scopes) runtime config scopes for current customer. List includes the Global scope that spans multiple customers, scope for customer specific overrides for current customer and one scope each for each universe and provider.
      operationId: listScopes
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
        example: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
      - in: query
        name: request
        schema: {}
        example: example-request
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeConfigData'
              examples:
                ListScopes200Example:
                  summary: Default listScopes 200 response
                  x-microcks-default: true
                  value:
                    scopedConfigList:
                    - configEntries:
                      - inherited: true
                        value: value
                        key: key
                      - inherited: true
                        value: value
                        key: key
                      mutableScope: true
                      type: GLOBAL
                      uuid: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
                    - configEntries:
                      - inherited: true
                        value: value
                        key: key
                      - inherited: true
                        value: value
                        key: key
                      mutableScope: true
                      type: GLOBAL
                      uuid: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: YugabyteDB Anywhere List Configuration Scopes
      tags:
      - Runtime configuration
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /api/v1/customers/{cUUID}/runtime_config/{scope}:
    get:
      description: Lists all runtime config entries for a given scope for current customer.
      operationId: getConfig
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
        example: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
      - in: path
        name: scope
        required: true
        schema:
          format: uuid
          type: string
        example: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
      - in: query
        name: includeInherited
        schema:
          default: false
          type: boolean
        example: false
      - in: query
        name: request
        schema: {}
        example: example-request
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScopedConfig'
              examples:
                GetConfig200Example:
                  summary: Default getConfig 200 response
                  x-microcks-default: true
                  value:
                    configEntries:
                    - inherited: true
                      value: value
                      key: key
                    - inherited: true
                      value: value
                      key: key
                    mutableScope: true
                    type: GLOBAL
                    uuid: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: YugabyteDB Anywhere List Configuration Entries for a Scope
      tags:
      - Runtime configuration
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
