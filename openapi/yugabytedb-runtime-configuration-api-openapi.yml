      security:
      - apiKeyAuth: []
      summary: YugabyteDB Anywhere Get a Configuration Key
      tags:
      - Runtime configuration
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    put:
      operationId: setKey
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
        example: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
      - in: path
        name: scope
        required: true
        schema:
          format: uuid
          type: string
        example: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
      - in: path
        name: key
        required: true
        schema:
          type: string
        example: example-key
      - in: query
        name: request
        schema: {}
        example: example-request
      requestBody:
        content:
          text/plain:
            schema:
              type: string
            examples:
              SetKeyRequestExample:
                summary: Default setKey request
                x-microcks-default: true
                value: string
        description: New value for config key
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YBPSuccess'
              examples:
                SetKey200Example:
                  summary: Default setKey 200 response
                  x-microcks-default: true
                  value:
                    success: true
                    message: message
          description: successful operation
      security:
      - apiKeyAuth: []
