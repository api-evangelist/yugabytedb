  description: 'Operations tagged Upload Release packages across 3 of this provider''s published API definitions: openapi_2.yaml, yugabytedb-anywhere-v1-full.yaml, yugabytedb-anywhere-v1-releases-maintenance.yaml. Each path carries the servers of the definition it was published in.'
servers:
- url: /
tags:
- name: Upload Release packages
paths:
  /api/v1/customers/{cUUID}/ybdb_release/upload:
    post:
      description: 'WARNING: This is a preview API that could change: upload release tgz file'
      operationId: uploadRelease
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: query
        name: request
        schema: {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YBPCreateSuccess'
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: upload a release tgz
      tags:
      - Upload Release packages
    servers:
    - url: /
  /api/v1/customers/{cUUID}/ybdb_release/upload/{rUUID}:
    get:
      description: 'WARNING: This is a preview API that could change: get uploaded release metadata'
      operationId: getUploadRelease
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: rUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: query
        name: request
        schema: {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseExtractMetadata'
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: get an uploaded release metadata
      tags:
      - Upload Release packages
    servers:
    - url: /
