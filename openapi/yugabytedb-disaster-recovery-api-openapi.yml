components:
  schemas:
    DrConfigFailoverForm:
      description: drConfig failover form
      example:
        namespaceIdSafetimeEpochUsMap:
          key: 0
        drReplicaUniverseUuid: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        primaryUniverseUuid: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
      properties:
        drReplicaUniverseUuid:
          description: New dr replica universe UUID
          format: uuid
          type: string
          example: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        namespaceIdSafetimeEpochUsMap:
          additionalProperties:
            format: int64
            type: integer
          description: A map from database ID to its safetime since epoch in micro-seconds to use during unplanned failover
          type: object
          example: {}
        primaryUniverseUuid:
          description: New primary universe UUID
          format: uuid
          type: string
          example: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
      type: object
    NamespaceSafetime:
      example:
        namespaceId: namespaceId
        safetimeLagUs: 1
        estimatedDataLossMs: 0.8008281904610115
        safetimeEpochUs: 6
        namespaceName: namespaceName
        safetimeSkewUs: 5
      properties:
        estimatedDataLossMs:
          format: double
          type: number
          example: 1.5
        namespaceId:
          type: string
          example: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        namespaceName:
          type: string
          example: example-namespaceName
        safetimeEpochUs:
          format: int64
          type: integer
          example: 1000
        safetimeLagUs:
          format: int64
          type: integer
          example: 1000
        safetimeSkewUs:
          format: int64
          type: integer
          example: 1000
      required:
      - estimatedDataLossMs
      - namespaceId
      - namespaceName
      - safetimeEpochUs
      - safetimeLagUs
      - safetimeSkewUs
      type: object
    DrConfigSetTablesForm:
      description: dr config set tables form
      example:
        tables: '["000033df000030008000000000004006", "000033df00003000800000000000400b"]'
        bootstrapParams:
          backupRequestParams:
