definitions:
  YBPSuccess:
    properties:
      message:
        description: API response message.
        readOnly: true
        type: string
      success:
        description: API operation status. A value of true indicates the operation was successful.
        readOnly: true
        type: boolean
    type: object
  Provider:
    properties:
      active:
        description: Provider active status
        readOnly: true
        type: boolean
      airGapInstall:
        description: Transient property - only present in mutate API request
        type: boolean
      code:
        description: Provider cloud code
        type: string
      config:
        additionalProperties:
          type: string
        type: object
      customHostCidrs:
        description: Transient property - only present in mutate API request
        items:
          type: string
        type: array
      customerUUID:
        description: Customer uuid
        format: uuid
        readOnly: true
        type: string
      destVpcId:
        description: Transient property - only present in mutate API request
        type: string
      hostVpcId:
        description: Transient property - only present in mutate API request
        type: string
      hostVpcRegion:
        description: Transient property - only present in mutate API request
        type: string
      hostedZoneId:
        type: string
      hostedZoneName:
        type: string
      keyPairName:
        description: Transient property - only present in mutate API request
        type: string
      name:
        description: Provider name
        type: string
      ntpServers:
        description: Transient property - only present in mutate API request
        items:
          type: string
        type: array
      overrideKeyValidate:
        description: Transient property - only present in mutate API request
        type: boolean
      regions:
        items:
          $ref: '#/definitions/Region'
        type: array
      setUpChrony:
        description: Transient property - only present in mutate API request
        type: boolean
      showSetUpChrony:
        description: Transient property - only present in mutate API request
        type: boolean
      sshPort:
        description: Transient property - only present in mutate API request
        format: int32
        type: integer
      sshPrivateKeyContent:
        description: Transient property - only present in mutate API request
        type: string
      sshUser:
        description: Transient property - only present in mutate API request
        type: string
      uuid:
        description: Provider uuid
        format: uuid
        readOnly: true
        type: string
    required:
    - regions
    type: object
  YBPTask:
    properties:
      resourceUUID:
        description: UUID of the resource being modified by the task
        format: uuid
        readOnly: true
        type: string
      taskUUID:
        description: Task UUID
        format: uuid
        readOnly: true
        type: string
    type: object
  AvailabilityZone:
    description: Availability zone (AZ) for a region
    properties:
      active:
        description: AZ status. This value is `true` for an active AZ.
        readOnly: true
        type: boolean
      code:
        description: AZ code
        example: us-west1-a
        type: string
      config:
        additionalProperties:
          type: string
        description: AZ configuration values
        type: object
      kubeconfigPath:
        description: Path to Kubernetes configuration file
        readOnly: true
        type: string
      name:
        description: AZ name
        example: us-west1-a
        type: string
      secondarySubnet:
        description: AZ secondary subnet
        example: secondary subnet id
        type: string
      subnet:
        description: AZ subnet
        example: subnet id
        type: string
      uuid:
        description: AZ UUID
        format: uuid
        readOnly: true
        type: string
    required:
    - name
    type: object
  Region:
    description: Region within a given provider. Typically, this maps to a single cloud provider region.
    properties:
      active:
        readOnly: true
        type: boolean
      architecture:
        enum:
        - x86_64
        - arm64
        type: string
      code:
        description: Cloud provider region code
        example: us-west-2
        type: string
      config:
        additionalProperties:
          type: string
        type: object
      latitude:
        description: The region's latitude
        example: 37.22
        format: double
        readOnly: true
        type: number
      longitude:
        description: The region's longitude
        example: -120.01
        format: double
        readOnly: true
        type: number
      name:
        description: Cloud provider region name
        example: US West (Oregon)
        readOnly: true
        type: string
      securityGroupId:
        type: string
      uuid:
        description: Region UUID
        format: uuid
        readOnly: true
        type: string
      vnetName:
        type: string
      ybImage:
        description: The AMI to be used in this region.
        example: TODO
        type: string
      zones:
        items:
          $ref: '#/definitions/AvailabilityZone'
        type: array
    required:
    - zones
    type: object
