        example: south-east
        type: string
      sshUser:
        description: SSH user
        example: centos
        type: string
      zone:
        description: Zone
        example: south-east
        type: string
    required:
    - instanceName
    - instanceType
    - ip
    - region
    - sshUser
    - zone
    type: object
  NodeInstance:
