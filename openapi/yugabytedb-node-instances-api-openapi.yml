      instanceTypeCode:
        description: The node's type code
        example: c5large
        type: string
      nodeName:
        description: The node's name
        example: India node
        type: string
      nodeUuid:
        description: The node's UUID
        format: uuid
        readOnly: true
        type: string
      zoneUuid:
        description: The availability zone's UUID
        format: uuid
        type: string
    required:
    - details
    type: object
