                          - 046b6c7f-0b8a-43b9-b35d-6489e6daee91
                          allow_all: true
                        - resource_type: UNIVERSE
                          resource_uuid_set:
                          - 046b6c7f-0b8a-43b9-b35d-6489e6daee91
                          - 046b6c7f-0b8a-43b9-b35d-6489e6daee91
                          allow_all: true
                      role_uuid: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
                    - resource_group:
                        resource_definition_set:
                        - resource_type: UNIVERSE
                          resource_uuid_set:
                          - 046b6c7f-0b8a-43b9-b35d-6489e6daee91
                          - 046b6c7f-0b8a-43b9-b35d-6489e6daee91
                          allow_all: true
                        - resource_type: UNIVERSE
                          resource_uuid_set:
                          - 046b6c7f-0b8a-43b9-b35d-6489e6daee91
                          - 046b6c7f-0b8a-43b9-b35d-6489e6daee91
                          allow_all: true
                      role_uuid: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
                    group_identifier: group_identifier
                    creation_date: 2022-12-12 13:07:18+00:00
                    type: LDAP
                    uuid: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          description: OK
        '400':
          description: Invalid input
        '500':
          description: Server error
      security:
      - apiKeyAuth: []
      summary: YugabyteDB Anywhere List Group Mappings
      tags:
      - Authentication
      x-yba-api-audit:
        noAudit: true
      x-yba-api-authz:
      - requiredPermission:
          resourceType: other
          action: read
        resourceLocation:
          path: customers
          sourceType: endpoint
      x-yba-api-since: 2024.2.0.0
      x-yba-api-visibility: preview
      x-accepts:
      - application/json
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    put:
      description: Map LDAP and OIDC groups to YBA roles
      operationId: updateGroupMappings
      parameters:
      - description: Customer UUID
        explode: false
        in: path
        name: cUUID
        required: true
