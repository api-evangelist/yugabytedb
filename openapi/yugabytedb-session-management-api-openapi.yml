openapi: 3.2.0
info:
  title: Yugabytedb Session management API
  version: v1
  contact:
    name: https://docs.yugabyte.com
  license:
    name: Polyform Free Trial License 1.0.0
    url: https://github.com/yugabyte/yugabyte-db/blob/master/licenses/POLYFORM-FREE-TRIAL-LICENSE-1.0.0.txt
  termsOfService: TODO(chirag)
  x-refined-note:
  - x-source differs across the merged source definitions and was not carried
  - x-split-from differs across the merged source definitions and was not carried
  description: 'Operations tagged Session management across 4 of this provider''s published API definitions: openapi_2.yaml, platform.swagger.json, yugabytedb-anywhere-v1-full.yaml, yugabytedb-anywhere-v1-users-rbac.yaml. Each path carries the servers of the definition it was published in.'
servers:
- url: /
tags:
- name: Session management
paths:
  /api/v1/api_login:
    post:
      operationId: apiLogin
      parameters:
      - in: query
        name: request
        schema: {}
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerLoginFormData'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionInfo'
          description: successful operation
      summary: Authenticate user using email and password
      tags:
      - Session management
      x-codegen-request-body-name: CustomerLoginFormData
    servers:
    - url: /
  /api/v1/app_version:
    get:
      operationId: appVersion
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: successful operation
      summary: appVersion
      tags:
      - Session management
    servers:
    - url: /
  /api/v1/customer_count:
    get:
      operationId: customerCount
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerCountResp'
          description: successful operation
      summary: customerCount
      tags:
      - Session management
    servers:
    - url: /
  /api/v1/customers/{cUUID}/admin_notifications:
    get:
      description: 'WARNING: This is a preview API that could change.'
      operationId: getAdminNotifications
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Current_admin_notification_messages'
          description: successful operation
      summary: Current list of notifications for admin
      tags:
      - Session management
    servers:
    - url: /
  /api/v1/customers/{cUUID}/api_token:
    put:
      operationId: api_token
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: query
        name: apiTokenVersion
        schema:
          default: -1
          format: int64
          type: integer
      - in: query
        name: request
        schema: {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionInfo'
          description: successful operation
      summary: Regenerate and fetch API token
      tags:
      - Session management
    servers:
    - url: /
  /api/v1/logs:
    get:
      operationId: getFilteredLogs
      parameters:
      - in: query
        name: maxLines
        schema:
          default: 10000
          format: int32
          type: integer
      - in: query
        name: universeName
        schema:
          default: 'null'
          type: string
      - in: query
        name: queryRegex
        schema:
          default: 'null'
          type: string
      - in: query
        name: startDate
        schema:
          default: 'null'
          type: string
      - in: query
        name: endDate
        schema:
          default: 'null'
          type: string
      responses:
        '200':
          content:
            text/plain:
              schema:
                type: string
          description: successful operation
      summary: getFilteredLogs
      tags:
      - Session management
    servers:
    - url: /
  /api/v1/logs/{maxLines}:
    get:
      operationId: getLogs
      parameters:
      - in: path
        name: maxLines
        required: true
        schema:
          format: int32
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogData'
          description: successful operation
      summary: getLogs
      tags:
      - Session management
    servers:
    - url: /
  /api/v1/register:
    post:
      description: Creates new customer and user
      operationId: registerCustomer
      parameters:
      - in: query
        name: generateApiToken
        schema:
          default: false
          type: boolean
      - in: query
        name: request
        schema: {}
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerRegisterFormData'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionInfo'
          description: successful operation
      summary: Register a customer
      tags:
      - Session management
      x-codegen-request-body-name: CustomerRegisterFormData
    servers:
    - url: /
  /api/v1/session_info:
    get:
      description: Available since YBA version 2.20.0.
      operationId: getSessionInfo
      parameters:
      - in: query
        name: request
        schema: {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionInfo'
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: Get current user and customer uuid. This will not generate or return the API token, use /api_token API for that.
      tags:
      - Session management
    servers:
    - url: /
