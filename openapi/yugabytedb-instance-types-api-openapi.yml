        arch: x86_64
        volumeDetailsList:
        - volumeSizeGB: 0
          volumeType: EBS
          mountPath: mountPath
        - volumeSizeGB: 0
          volumeType: EBS
          mountPath: mountPath
      properties:
        arch:
          description: Architecture for the instance.
          enum:
          - x86_64
          - aarch64
          type: string
