definitions:
  VolumeDetails:
    properties:
      mountPath:
        type: string
      volumeSizeGB:
        format: int32
        type: integer
      volumeType:
        enum:
        - EBS
        - SSD
        - HDD
        - NVME
        type: string
    required:
    - mountPath
    - volumeSizeGB
    - volumeType
    type: object
  YBPSuccess:
    properties:
      message:
        description: API response message.
        readOnly: true
        type: string
      success:
        description: API operation status. A value of true indicates the operation was successful.
        readOnly: true
        type: boolean
    type: object
  Provider:
    properties:
      active:
        description: Provider active status
        readOnly: true
        type: boolean
      airGapInstall:
        description: Transient property - only present in mutate API request
        type: boolean
      code:
        description: Provider cloud code
        type: string
      config:
        additionalProperties:
          type: string
        type: object
      customHostCidrs:
        description: Transient property - only present in mutate API request
        items:
          type: string
        type: array
      customerUUID:
        description: Customer uuid
        format: uuid
        readOnly: true
        type: string
      destVpcId:
        description: Transient property - only present in mutate API request
        type: string
      hostVpcId:
        description: Transient property - only present in mutate API request
        type: string
