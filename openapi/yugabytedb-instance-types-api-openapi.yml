          type: string
        example: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
      - in: path
        name: pUUID
        required: true
        schema:
          format: uuid
          type: string
        example: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
      - in: path
        name: code
        required: true
        schema:
          type: string
        example: OK
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceTypeResp'
              examples:
                InstanceTypeDetail200Example:
                  summary: Default instanceTypeDetail 200 response
                  x-microcks-default: true
                  value:
                    numCores: 1.4658129805029452
                    idKey:
                      instanceTypeCode: instanceTypeCode
                      providerUuid: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
                    providerCode: providerCode
                    memSizeGB: 6.027456183070403
                    instanceTypeCode: instanceTypeCode
                    instanceTypeDetails:
                      tenancy: Shared
                      arch: x86_64
                      volumeDetailsList:
                      - volumeSizeGB: 0
                        volumeType: EBS
                        mountPath: mountPath
                      - volumeSizeGB: 0
                        volumeType: EBS
                        mountPath: mountPath
                    active: true
                    providerUuid: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: YugabyteDB Anywhere Get Details of an Instance Type
      tags:
      - Instance types
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /api/v1/metadata/azu_types:
    get:
      operationId: getAZUTypes
