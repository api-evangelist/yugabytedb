          format: int32
          type: integer
          example: 5433
        sshUserOverride:
          description: sshUserOverride for the bundle. <b style="color:#ff0000">Deprecated since YBA version 2.20.3.0.</b> Use imageBundles.details.sshUser instead.
          type: string
          example: example-sshUserOverride
        ybImage:
          type: string
          example: example-ybImage
      type: object
    Metadata:
      example:
        type: YBA_ACTIVE
        version: version
      properties:
        type:
          enum:
          - YBA_ACTIVE
          - YBA_DEPRECATED
          - CUSTOM
          type: string
          example: YBA_ACTIVE
        version:
          type: string
          example: 2.20.0.0
      required:
