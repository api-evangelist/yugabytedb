servers:
- url: /
tags:
- name: GFlags Validation APIs
paths:
  /api/v1/metadata/version/{version}/gflag:
    get:
      description: 'WARNING: This is a preview API that could change.'
      operationId: getGFlagMetadata
      parameters:
      - in: path
        name: version
        required: true
        schema:
          type: string
      - in: query
        name: name
        schema:
          type: string
      - in: query
        name: server
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GFlagDetails'
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: Get gflag metadata
      tags:
      - GFlags Validation APIs
    servers:
    - url: /
  /api/v1/metadata/version/{version}/list_gflags:
    get:
      description: 'WARNING: This is a preview API that could change.'
      operationId: listGFlags
      parameters:
      - in: path
        name: version
        required: true
        schema:
          type: string
      - in: query
        name: name
        schema:
          type: string
      - in: query
        name: server
        schema:
          type: string
      - in: query
        name: mostUsedGFlags
        schema:
          default: false
          type: boolean
      - in: query
        name: showExperimental
        schema:
          default: false
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/GFlagDetails'
                type: array
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: List all gflags for a release
      tags:
      - GFlags Validation APIs
    servers:
    - url: /
  /api/v1/metadata/version/{version}/validate_gflags:
    post:
      description: 'WARNING: This is a preview API that could change.'
      operationId: validateGFlags
      parameters:
      - in: path
        name: version
        required: true
        schema:
          type: string
      - in: query
        name: request
        schema: {}
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GFlagsValidationFormData'
        description: GFlag validation form data
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/GFlagsValidationResponse'
                type: array
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: Validate gflags
      tags:
      - GFlags Validation APIs
      x-codegen-request-body-name: gflag_validation_form_data
    servers:
    - url: /
