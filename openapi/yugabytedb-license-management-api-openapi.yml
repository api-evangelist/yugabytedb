servers:
- url: /
tags:
- name: License management
paths:
  /api/v1/customers/{cUUID}/licenses:
    post:
      operationId: upload_license
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: query
        name: request
        schema: {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerLicense'
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: Uploads the license
      tags:
      - License management
    servers:
    - url: /
  /api/v1/customers/{cUUID}/licenses/{lUUID}:
    delete:
      operationId: deleteLicense
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: lUUID
        required: true
        schema:
          format: uuid
          type: string
      - in: query
        name: request
        schema: {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YBPSuccess'
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: Delete a license
      tags:
      - License management
    servers:
    - url: /
