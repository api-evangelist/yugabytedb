    SupportBundleSizeEstimateResponse:
      example:
        data:
          key:
            key: 0
      properties:
        data:
          additionalProperties:
            additionalProperties:
              format: int64
              type: integer
            type: object
          description: A map of universe node names to component sizes for the given support bundle payload. Global component sizes are mapped to "YBA" node.
          type: object
          example: {}
      type: object
    BundleDetails:
      example:
        maxNumRecentCores: 6
        components:
        - UniverseLogs
        - UniverseLogs
        paDumpStartDate: 2022-12-12 13:07:18+00:00
        promDumpEndDate: 2022-12-12 13:07:18+00:00
        promDumpStartDate: 2022-12-12 13:07:18+00:00
        promMetricsFormat: PROMQL_JSON
        paDumpEndDate: 2022-12-12 13:07:18+00:00
        paMetricsFormat: PROMQL_JSON
        promMetricsStepSec: 1
        prometheusMetricsTypes:
        - MASTER_EXPORT
        - MASTER_EXPORT
        maxCoreFileSize: 0
      properties:
        components:
          items:
            enum:
            - UniverseLogs
            - OutputFiles
            - ErrorFiles
            - CoreFiles
            - GFlags
            - Instance
            - ConsensusMeta
            - TabletMeta
            - YbcLogs
            - NodeAgent
            - SystemLogs
            - TabletReport
            - K8sInfo
            - YbaMetadata
            - PrometheusMetrics
            - PerfAdvisor
            - ApplicationLogs
            type: string
          type: array
          example:
