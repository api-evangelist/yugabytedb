openapi: 3.1.0
info:
  title: YugabyteDB Aeon REST Access Keys Support Bundle management API
  description: The YugabyteDB Aeon REST API provides programmatic access to YugabyteDB's fully managed cloud database service. Developers and operators can use it to deploy and manage database clusters, configure read replicas, schedule and execute on-demand backups and restores, manage IP allow lists, and set up monitoring and alerts. Authentication is performed using API keys passed as bearer tokens in the Authorization header. All paths are scoped to an account and project, which can be obtained from the YugabyteDB Aeon UI profile page.
  version: v1
  contact:
    name: Yugabyte Support
    url: https://support.yugabyte.com
  termsOfService: https://www.yugabyte.com/yugabytedb-managed-service-terms/
  x-generated-from: documentation
  x-source-url: https://api-docs.yugabyte.com/docs/managed-apis/
  x-last-validated: '2026-05-03'
servers:
- url: https://cloud.yugabyte.com/api/public/v1
  description: YugabyteDB Aeon Production Server
security:
- bearerAuth: []
tags:
- name: Support Bundle management
paths:
  /api/v1/customers/{cUUID}/support_bundle/components:
    get:
      operationId: listSupportBundleComponents
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
        example: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  enum:
                  - UniverseLogs
                  - OutputFiles
                  - ErrorFiles
                  - CoreFiles
                  - GFlags
                  - Instance
                  - ConsensusMeta
                  - TabletMeta
                  - YbcLogs
                  - NodeAgent
                  - SystemLogs
                  - TabletReport
                  - K8sInfo
                  - YbaMetadata
                  - PrometheusMetrics
                  - PerfAdvisor
                  - ApplicationLogs
                  type: string
                type: array
              examples:
                ListSupportBundleComponents200Example:
                  summary: Default listSupportBundleComponents 200 response
                  x-microcks-default: true
                  value:
                  - UniverseLogs
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: YugabyteDB Anywhere List All Components Available in Support Bundle
      tags:
      - Support Bundle management
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /api/v1/customers/{cUUID}/universes/{uniUUID}/support_bundle:
    get:
      operationId: listSupportBundle
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
        example: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
      - in: path
        name: uniUUID
        required: true
        schema:
          format: uuid
          type: string
        example: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SupportBundle'
                type: array
              examples:
                ListSupportBundle200Example:
                  summary: Default listSupportBundle 200 response
                  x-microcks-default: true
                  value:
                  - path: path
                    sizeInBytes: 5
                    scopeUUID: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
                    bundleDetails:
                      maxNumRecentCores: 6
                      components:
                      - UniverseLogs
                      - UniverseLogs
                      paDumpStartDate: 2022-12-12 13:07:18+00:00
                      promDumpEndDate: 2022-12-12 13:07:18+00:00
                      promDumpStartDate: 2022-12-12 13:07:18+00:00
                      promMetricsFormat: PROMQL_JSON
                      paDumpEndDate: 2022-12-12 13:07:18+00:00
                      paMetricsFormat: PROMQL_JSON
                      promMetricsStepSec: 1
                      prometheusMetricsTypes:
                      - MASTER_EXPORT
                      - MASTER_EXPORT
                      maxCoreFileSize: 0
                    endDate: 2022-12-12 13:07:18+00:00
                    bundleUUID: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
                    creationDate: 2022-12-12 13:07:18+00:00
                    startDate: 2022-12-12 13:07:18+00:00
                    expirationDate: 2022-12-12 13:07:18+00:00
                    status: Running
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: YugabyteDB Anywhere List All Support Bundles from a Universe
      tags:
      - Support Bundle management
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    post:
      operationId: createSupportBundle
      parameters:
      - in: path
        name: cUUID
        required: true
        schema:
          format: uuid
          type: string
        example: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
      - in: path
        name: uniUUID
        required: true
        schema:
          format: uuid
          type: string
        example: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
      - in: query
        name: request
        schema: {}
        example: example-request
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportBundleFormData'
            examples:
              CreateSupportBundleRequestExample:
                summary: Default createSupportBundle request
                x-microcks-default: true
                value:
                  maxNumRecentCores: 1
                  components:
                  - UniverseLogs
                  - UniverseLogs
                  paDumpStartDate: '2022-12-12T13:07:18+00:00'
                  promDumpEndDate: '2022-12-12T13:07:18+00:00'
                  promDumpStartDate: '2022-12-12T13:07:18+00:00'
                  endDate: '2022-12-12T13:07:18+00:00'
                  filterPgAuditLogs: true
                  prometheusMetricsTypes:
                  - MASTER_EXPORT
                  - MASTER_EXPORT
                  promDumpDownSample: true
                  promQueries:
                    key: promQueries
                  stepPromDumpSecs: 5
                  batchDurationPromDumpMins: 0
                  promMetricsFormat: PROMQL_JSON
                  paDumpEndDate: '2022-12-12T13:07:18+00:00'
                  paMetricsFormat: PROMQL_JSON
                  startDate: '2022-12-12T13:07:18+00:00'
                  maxCoreFileSize: 6
                  promExportType: PROMQL
        description: post support bundle info
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YBPTask'
              examples:
                CreateSupportBundle200Example:
                  summary: Default createSupportBundle 200 response
                  x-microcks-default: true
                  value:
                    taskUUID: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
                    resourceUUID: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          description: successful operation
      security:
      - apiKeyAuth: []
      summary: YugabyteDB Anywhere Create Support Bundle for Specific Universe
      tags:
      - Support Bundle management
      x-codegen-request-body-name: supportBundle
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
