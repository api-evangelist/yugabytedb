                  maxCoreFileSize: 6
                  promExportType: PROMQL
        description: support bundle info
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportBundleSizeEstimateResponse'
              examples:
