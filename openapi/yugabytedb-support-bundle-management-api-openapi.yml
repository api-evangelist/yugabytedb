        maxCoreFileSize:
          description: Max size of the collected cores (if any)
          format: int64
          type: integer
          example: 10
        maxNumRecentCores:
          description: Max number of most recent cores to collect (if any)
          format: int32
          type: integer
          example: 10
        paDumpEndDate:
          description: End date to filter Perf Advisor data
          example: 2022-12-12 13:07:18+00:00
          format: date-time
          type: string
        paDumpStartDate:
          description: Start date to filter Perf Advisor data
          example: 2022-12-12 13:07:18+00:00
          format: date-time
          type: string
        paMetricsFormat:
          description: Specifies PA Dump metrics format.
          enum:
          - PROMQL_JSON
          - PROM_CHUNK
          type: string
          example: PROMQL_JSON
        promDumpEndDate:
          description: End date to filter prometheus metrics till
          example: 2022-12-12 13:07:18+00:00
          format: date-time
          type: string
        promDumpStartDate:
          description: Start date to filter prometheus metrics from
          example: 2022-12-12 13:07:18+00:00
          format: date-time
          type: string
        promMetricsFormat:
          description: Specifies Prom Dump metrics format.
          enum:
          - PROMQL_JSON
          - PROM_CHUNK
          type: string
          example: PROMQL_JSON
        promMetricsStepSec:
          description: Specifies Prom Dump metrics step in seconds.
          format: int32
          type: integer
          example: 100
        prometheusMetricsTypes:
          description: List of exports to be included in the prometheus dump
          items:
            enum:
            - MASTER_EXPORT
            - NODE_EXPORT
            - PLATFORM
            - PROMETHEUS
            - TSERVER_EXPORT
            - CQL_EXPORT
            - YSQL_EXPORT
            type: string
          type: array
          example:
          - MASTER_EXPORT
      required:
      - components
      type: object
    YBPSuccess:
      example:
        success: true
        message: message
      properties:
        message:
          description: API response message.
          readOnly: true
          type: string
          example: Example message
        success:
          description: API operation status. A value of true indicates the operation was successful.
          readOnly: true
          type: boolean
          example: true
      type: object
    SupportBundle:
      example:
        path: path
        sizeInBytes: 5
        scopeUUID: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        bundleDetails:
          maxNumRecentCores: 6
