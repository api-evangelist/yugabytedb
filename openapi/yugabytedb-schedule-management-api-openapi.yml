          type: integer
          example: 1000
        frequencyTimeUnit:
          description: Time Unit for frequency
          enum:
          - NANOSECONDS
          - MICROSECONDS
          - MILLISECONDS
          - SECONDS
          - MINUTES
          - HOURS
          - DAYS
          - MONTHS
          - YEARS
          type: string
          example: NANOSECONDS
        incrementalBackupFrequency:
          description: Frequency of incremental backup schedule
          format: int64
          type: integer
          example: 1000
        incrementalBackupFrequencyTimeUnit:
          description: TimeUnit for incremental Backup Schedule frequency
          enum:
          - NANOSECONDS
          - MICROSECONDS
          - MILLISECONDS
          - SECONDS
          - MINUTES
          - HOURS
          - DAYS
          - MONTHS
          - YEARS
          type: string
          example: NANOSECONDS
        runImmediateBackupOnResume:
          description: Run a full or incremental backup if the schedule is expired when resuming a stopped schedule
          type: boolean
          example: true
