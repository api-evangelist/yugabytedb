    DatabaseUserFormData:
      example:
        password: password
        ycqlAdminUsername: ycqlAdminUsername
        dbRoleAttributes:
        - name: SUPERUSER
        - name: SUPERUSER
        ysqlAdminPassword: ysqlAdminPassword
        dbName: dbName
